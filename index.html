<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BANANA</title>


  <style>

    /* ==================================================
       BASIC
    ================================================== */

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #ecebe7;
      --ink: #111111;

      --font-size: 130px;

      --site-font:
        Helvetica,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        Arial,
        sans-serif;

    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body {

      background: var(--bg);

      color: var(--ink);

      font-family: var(--site-font);

    }



    /* ==================================================
       TOP HOVER AREA
    ================================================== */

    .top-zone {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 110px;

      z-index: 100;

    }



    .hover-line {

      position: absolute;

      top: 0;
      left: 50%;

      transform:
        translateX(-50%);

      width: 80px;
      height: 2px;

      background:
        var(--ink);

      opacity: 0.25;

      transition:
        width 0.3s ease,
        opacity 0.3s ease;

    }



    .top-zone:hover
    .hover-line {

      width: 100%;

      opacity: 0;

    }



    /* ==================================================
       HEADER
    ================================================== */

    header {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding:
        0 22px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      background:
        var(--bg);

      border-bottom:
        1px solid var(--ink);

      font-family:
        var(--site-font);

      transform:
        translateY(-100%);

      opacity: 0;

      transition:

        transform
        0.35s
        cubic-bezier(
          0.22,
          1,
          0.36,
          1
        ),

        opacity
        0.25s ease;

    }



    .top-zone:hover
    header {

      transform:
        translateY(0);

      opacity: 1;

    }



    /* ==================================================
       LOGO
    ================================================== */

    .logo {

      font-family:
        var(--site-font);

      font-size: 15px;

      font-weight: 500;

      letter-spacing:
        0.1em;

    }



    /* ==================================================
       CONTROLS
    ================================================== */

    .controls {

      display: flex;

      align-items: center;

      gap: 22px;

      font-family:
        var(--site-font);

      font-size: 10px;

      letter-spacing:
        0.06em;

    }



    .control {

      display: flex;

      align-items: center;

      gap: 8px;

    }



    /* ==================================================
       RANGE
    ================================================== */

    input[type="range"] {

      appearance: none;

      -webkit-appearance: none;

      width: 90px;
      height: 1px;

      background:
        var(--ink);

      outline: none;

      cursor: pointer;

    }



    input[type="range"]::-webkit-slider-thumb {

      appearance: none;

      -webkit-appearance: none;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background:
        var(--ink);

      cursor: pointer;

    }



    input[type="range"]::-moz-range-thumb {

      width: 9px;
      height: 9px;

      border: none;

      border-radius: 50%;

      background:
        var(--ink);

      cursor: pointer;

    }



    /* ==================================================
       BUTTONS
    ================================================== */

    button,
    .font-upload {

      padding:
        7px 11px;

      border:
        1px solid var(--ink);

      background:
        transparent;

      color:
        var(--ink);

      font-family:
        var(--site-font);

      font-size: 9px;

      letter-spacing:
        0.06em;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;

    }



    button:hover,
    .font-upload:hover {

      background:
        var(--ink);

      color:
        var(--bg);

    }



    #fontInput {

      display: none;

    }



    /* ==================================================
       MAIN
    ================================================== */

    .tester {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

    }



    /* ==================================================
       MAGNET FIELD
    ================================================== */

    #field {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 0;

    }



    .magnet-line {

      stroke:
        var(--ink);

      stroke-width: 1;

      fill: none;

      vector-effect:
        non-scaling-stroke;

    }



    /* ==================================================
       DISPLAY AREA
    ================================================== */

    #displayArea {

      position: absolute;

      inset: 0;

      padding:
        70px
        40px
        60px
        40px;

      font-family:
        var(--site-font);

      font-size:
        var(--font-size);

      line-height:
        1;

      letter-spacing:
        -0.04em;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

      word-break:
        break-word;

      pointer-events:
        none;

      z-index: 1;

    }



    /* ==================================================
       INDIVIDUAL GLYPH
    ================================================== */

    .glyph {

      position: relative;

      display:
        inline-block;


      /*
        기존보다 조금 빠르게 바꿨습니다.

        타이핑 중에도 글자가
        쫀득하게 따라오는 느낌.
      */

      transition:

        transform
        0.18s
        cubic-bezier(
          0.22,
          1,
          0.36,
          1
        );


      will-change:
        transform;

    }



    /* ==================================================
       REAL TEXTAREA
    ================================================== */

    #inputArea {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      padding:
        70px
        40px
        60px
        40px;

      margin: 0;

      resize: none;

      border: none;
      outline: none;

      background:
        transparent;


      /*
        실제 textarea 텍스트는 숨김.
        displayArea에서 보여줍니다.
      */

      color:
        transparent;


      caret-color:
        var(--ink);


      font-family:
        var(--site-font);


      font-size:
        var(--font-size);


      line-height:
        1;


      letter-spacing:
        -0.04em;


      white-space:
        pre-wrap;


      overflow-wrap:
        anywhere;


      word-break:
        break-word;


      z-index: 2;

    }



    /*
      Safari / Chrome에서
      한글 IME 조합 영역 자체가
      이상하게 색칠되지 않도록
    */

    #inputArea::selection {

      background:
        rgba(
          0,
          0,
          0,
          0.12
        );

    }



    /* ==================================================
       FOOTER
    ================================================== */

    .credit {

      position: absolute;

      left: 22px;
      bottom: 18px;

      z-index: 10;

      font-family:
        var(--site-font);

      font-size: 9px;

      letter-spacing:
        0.08em;

      pointer-events: none;

    }



    #fontName {

      position: absolute;

      right: 22px;
      bottom: 18px;

      z-index: 10;

      font-family:
        var(--site-font);

      font-size: 9px;

      letter-spacing:
        0.08em;

      pointer-events: none;

    }



    /* ==================================================
       MOBILE
    ================================================== */

    @media (
      max-width: 800px
    ) {

      header {

        padding:
          0 12px;

      }


      .controls {

        gap: 10px;

      }


      .control-label {

        display: none;

      }


      input[type="range"] {

        width: 55px;

      }


      #inputArea,
      #displayArea {

        padding:
          65px
          18px
          50px
          18px;

      }

    }

  </style>

</head>



<body>



  <!-- ==================================================
       TOP
  =================================================== -->

  <div class="top-zone">


    <div
      class="hover-line"
    ></div>



    <header>


      <div class="logo">
        BANANA
      </div>



      <div class="controls">


        <!-- FONT -->

        <label
          class="font-upload"
        >

          LOAD FONT

          <input
            id="fontInput"

            type="file"

            accept="
              .ttf,
              .otf,
              .woff,
              .woff2
            "
          >

        </label>



        <!-- SIZE -->

        <div class="control">

          <span
            class="control-label"
          >
            SIZE
          </span>


          <input
            id="sizeSlider"

            type="range"

            min="30"

            max="250"

            value="130"
          >


          <span
            id="sizeValue"
          >
            130
          </span>

        </div>



        <!-- MAGNET -->

        <div class="control">

          <span
            class="control-label"
          >
            MAGNET
          </span>


          <input
            id="magnetSlider"

            type="range"

            min="0"

            max="100"

            value="55"
          >


          <span
            id="magnetValue"
          >
            55
          </span>

        </div>



        <!-- CLEAR -->

        <button
          id="clearButton"
        >
          CLEAR
        </button>


      </div>

    </header>

  </div>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main class="tester">


    <svg
      id="field"
    ></svg>



    <div
      id="displayArea"
    ></div>



    <textarea
      id="inputArea"

      spellcheck="false"

      autofocus
    >BANANA</textarea>



    <div class="credit">
      MADE BY APPLESOAP
    </div>



    <div id="fontName">
      HELVETICA
    </div>


  </main>



  <script>


    /* ==================================================
       ELEMENTS
    ================================================== */

    const inputArea =
      document.querySelector(
        "#inputArea"
      );


    const displayArea =
      document.querySelector(
        "#displayArea"
      );


    const field =
      document.querySelector(
        "#field"
      );


    const sizeSlider =
      document.querySelector(
        "#sizeSlider"
      );


    const sizeValue =
      document.querySelector(
        "#sizeValue"
      );


    const magnetSlider =
      document.querySelector(
        "#magnetSlider"
      );


    const magnetValue =
      document.querySelector(
        "#magnetValue"
      );


    const fontInput =
      document.querySelector(
        "#fontInput"
      );


    const fontName =
      document.querySelector(
        "#fontName"
      );


    const clearButton =
      document.querySelector(
        "#clearButton"
      );



    /* ==================================================
       ANIMATION FRAME CONTROL
    ================================================== */

    /*
      한글을 빠르게 입력하면

      compositionupdate
      input
      compositionupdate
      input...

      이벤트가 엄청 많이 발생합니다.

      매 이벤트마다 magnet 계산을 하면
      버벅일 수 있으므로

      브라우저 화면 갱신 주기마다
      최대 한 번만 계산합니다.
    */

    let renderFrame =
      null;



    function scheduleRender() {


      /*
        이미 이번 프레임에
        렌더 예약이 있다면
        취소하고 최신 것으로 갱신
      */

      if (
        renderFrame !== null
      ) {

        cancelAnimationFrame(
          renderFrame
        );

      }



      renderFrame =
        requestAnimationFrame(

          () => {


            renderFrame =
              null;


            renderText();

          }

        );

    }



    /* ==================================================
       UTILITY
    ================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.max(

        min,

        Math.min(
          value,
          max
        )

      );

    }



    /* ==================================================
       NORMALIZE CHARACTER
    ================================================== */

    function normalizeCharacter(
      character
    ) {


      /*
        비교할 때만 NFC 사용.

        화면에 보여주는 실제 문자열은
        건드리지 않습니다.

        따라서 한글 IME 조합 중인
        글자도 자연스럽게 화면에 표시됩니다.
      */

      return character.normalize(
        "NFC"
      );

    }



    /* ==================================================
       RENDER
    ================================================== */

    function renderText() {


      displayArea.innerHTML =
        "";


      field.innerHTML =
        "";



      /*
        중요:

        inputArea.value를 그대로 사용합니다.

        전체 문장을 먼저 normalize 하지 않습니다.

        한글 조합 중간 상태가
        즉시 보이도록 하기 위함입니다.
      */

      const text =
        inputArea.value;



      Array
        .from(text)
        .forEach(

          character => {


            /* --------------------------
               LINE BREAK
            -------------------------- */

            if (
              character === "\n"
            ) {

              displayArea.appendChild(

                document.createElement(
                  "br"
                )

              );

              return;

            }



            /* --------------------------
               GLYPH
            -------------------------- */

            const span =

              document.createElement(
                "span"
              );


            span.className =
              "glyph";


            /*
              비교용 key
            */

            span.dataset.char =

              normalizeCharacter(
                character
              );



            /* --------------------------
               SPACE
            -------------------------- */

            if (
              character === " "
            ) {

              span.innerHTML =
                "&nbsp;";

            }

            else {


              /*
                화면에는 실제 입력 중인
                문자 그대로 표시합니다.
              */

              span.textContent =
                character;

            }



            displayArea.appendChild(
              span
            );

          }

        );



      /*
        글자 위치 계산이 끝난
        다음 프레임에서 magnet 계산.
      */

      requestAnimationFrame(
        applyMagnet
      );

    }



    /* ==================================================
       MAGNET
    ================================================== */

    function applyMagnet() {


      const glyphs =

        Array.from(

          document.querySelectorAll(
            ".glyph"
          )

        );



      const groups =
        {};



      glyphs.forEach(

        glyph => {


          const character =
            glyph.dataset.char;



          /*
            공백 제외
          */

          if (
            character === " "
          ) {

            glyph.style.transform =
              "translate(0px, 0px)";

            return;

          }



          /*
            같은 글자끼리 그룹
          */

          if (
            !groups[character]
          ) {

            groups[character] =
              [];

          }



          groups[character]
            .push(
              glyph
            );

        }

      );



      const strength =

        Number(
          magnetSlider.value
        )
        /
        100;



      field.innerHTML =
        "";



      Object
        .values(groups)
        .forEach(

          group => {


            /*
              하나밖에 없으면
              이동 X
            */

            if (
              group.length < 2
            ) {

              group[0]
                .style
                .transform =
                "translate(0px, 0px)";

              return;

            }



            /* ------------------------------------------
               POSITIONS
            ------------------------------------------ */

            const positions =

              group.map(

                glyph => ({

                  element:
                    glyph,

                  x:
                    glyph.offsetLeft
                    +
                    glyph.offsetWidth
                    /
                    2,

                  y:
                    glyph.offsetTop
                    +
                    glyph.offsetHeight
                    /
                    2

                })

              );



            /* ------------------------------------------
               CENTER
            ------------------------------------------ */

            const centerX =

              positions.reduce(

                (
                  sum,
                  item
                ) =>

                  sum
                  +
                  item.x,

                0

              )

              /

              positions.length;



            const centerY =

              positions.reduce(

                (
                  sum,
                  item
                ) =>

                  sum
                  +
                  item.y,

                0

              )

              /

              positions.length;



            const finalPositions =
              [];



            /* ------------------------------------------
               MOVE
            ------------------------------------------ */

            positions.forEach(

              item => {


                const differenceX =

                  centerX
                  -
                  item.x;



                const differenceY =

                  centerY
                  -
                  item.y;



                const moveX =

                  clamp(

                    differenceX
                    *
                    strength
                    *
                    0.35,

                    -180,

                    180

                  );



                const moveY =

                  clamp(

                    differenceY
                    *
                    strength
                    *
                    0.20,

                    -70,

                    70

                  );



                item
                  .element
                  .style
                  .transform =

                  `translate(
                    ${moveX}px,
                    ${moveY}px
                  )`;



                finalPositions.push({

                  x:
                    item.x
                    +
                    moveX,

                  y:
                    item.y
                    +
                    moveY

                });

              }

            );



            /* ------------------------------------------
               CONNECT
            ------------------------------------------ */

            for (

              let i = 0;

              i <
              finalPositions.length - 1;

              i++

            ) {


              drawConnection(

                finalPositions[i],

                finalPositions[i + 1],

                strength

              );

            }

          }

        );

    }



    /* ==================================================
       CONNECTION LINE
    ================================================== */

    function drawConnection(
      start,
      end,
      strength
    ) {


      const path =

        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "path"

        );



      const middleX =

        (
          start.x
          +
          end.x
        )
        /
        2;



      const middleY =

        Math.min(
          start.y,
          end.y
        )
        -
        25;



      const pathData =

        `M ${start.x} ${start.y}
         Q ${middleX} ${middleY}
         ${end.x} ${end.y}`;



      path.setAttribute(
        "d",
        pathData
      );


      path.setAttribute(
        "class",
        "magnet-line"
      );


      path.style.opacity =

        0.03
        +
        strength
        *
        0.12;



      field.appendChild(
        path
      );

    }



    /* ==================================================
       NORMAL INPUT
    ================================================== */

    /*
      이제 한글 조합 중이든 아니든
      항상 렌더링합니다.
    */

    inputArea
      .addEventListener(

        "input",

        scheduleRender

      );



    /* ==================================================
       KOREAN IME START
    ================================================== */

    inputArea
      .addEventListener(

        "compositionstart",

        () => {


          /*
            바로 그려줌.
          */

          scheduleRender();

        }

      );



    /* ==================================================
       KOREAN IME UPDATE
    ================================================== */

    inputArea
      .addEventListener(

        "compositionupdate",

        () => {


          /*
            핵심.

            ㅎ
            하
            한

            처럼 글자가 변할 때마다
            화면 + magnet 갱신.
          */

          scheduleRender();

        }

      );



    /* ==================================================
       KOREAN IME END
    ================================================== */

    inputArea
      .addEventListener(

        "compositionend",

        () => {


          /*
            최종 확정된 글자로
            한 번 더 갱신.
          */

          scheduleRender();

        }

      );



    /* ==================================================
       SIZE
    ================================================== */

    sizeSlider
      .addEventListener(

        "input",

        () => {


          const size =
            sizeSlider.value;


          sizeValue.textContent =
            size;



          document
            .documentElement
            .style
            .setProperty(

              "--font-size",

              `${size}px`

            );



          scheduleRender();

        }

      );



    /* ==================================================
       MAGNET STRENGTH
    ================================================== */

    magnetSlider
      .addEventListener(

        "input",

        () => {


          magnetValue.textContent =
            magnetSlider.value;



          /*
            글자 자체를 다시 만들 필요 없이
            자석만 다시 계산.
          */

          requestAnimationFrame(
            applyMagnet
          );

        }

      );



    /* ==================================================
       CLEAR
    ================================================== */

    clearButton
      .addEventListener(

        "click",

        () => {


          inputArea.value =
            "";


          scheduleRender();


          inputArea.focus();

        }

      );



    /* ==================================================
       FONT LOAD
    ================================================== */

    fontInput
      .addEventListener(

        "change",

        async event => {


          const file =

            event
              .target
              .files[0];


          if (
            !file
          ) {

            return;

          }



          const fontURL =

            URL.createObjectURL(
              file
            );



          const customFont =

            new FontFace(

              "CustomLetterMagnetFont",

              `url(${fontURL})`

            );



          try {


            await customFont.load();



            document.fonts.add(
              customFont
            );



            document
              .documentElement
              .style
              .setProperty(

                "--site-font",

                `
                'CustomLetterMagnetFont',
                'Apple SD Gothic Neo',
                'Noto Sans KR',
                Arial,
                sans-serif
                `

              );



            const cleanName =

              file.name.replace(

                /\.[^/.]+$/,

                ""

              );



            fontName.textContent =
              cleanName;



            scheduleRender();


            inputArea.focus();


          }


          catch (
            error
          ) {


            console.error(
              error
            );


            alert(
              "폰트 파일을 불러오지 못했습니다."
            );

          }

        }

      );



    /* ==================================================
       WINDOW RESIZE
    ================================================== */

    window
      .addEventListener(

        "resize",

        scheduleRender

      );



    /* ==================================================
       SCROLL
    ================================================== */

    inputArea
      .addEventListener(

        "scroll",

        () => {


          displayArea
            .style
            .transform =

            `translate(
              ${-inputArea.scrollLeft}px,
              ${-inputArea.scrollTop}px
            )`;



          field
            .style
            .transform =

            `translate(
              ${-inputArea.scrollLeft}px,
              ${-inputArea.scrollTop}px
            )`;

        }

      );



    /* ==================================================
       START
    ================================================== */

    scheduleRender();


    inputArea.focus();


    inputArea
      .setSelectionRange(

        inputArea.value.length,

        inputArea.value.length

      );


  </script>

</body>

</html>
